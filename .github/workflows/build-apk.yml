name: Build NudgeProof Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build stable logo-only APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          test -f "$APK"
          "$BT/aapt" dump badging "$APK" | head -20
          "$BT/zipalign" -c -v 4 "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" | tee APK_SHA256.txt

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NudgeProof-Mobile-v4.5.0-Stable-Red-Logo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NudgeProof-Mobile-v4.5.0-Stable-Red-Logo
          path: |
            NudgeProof-Mobile-v4.5.0-Stable-Red-Logo.apk
            APK_SHA256.txt
          if-no-files-found: error

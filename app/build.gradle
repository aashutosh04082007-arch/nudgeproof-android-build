plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.nudgeproof.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.nudgeproof.mobile'
        minSdk 24
        targetSdk 35
        versionCode 440
        versionName '4.4.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-sideload'
        }
        release {
            minifyEnabled false
            debuggable false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
